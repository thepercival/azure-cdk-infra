name: Reusable — deploy Bicep to environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource-group:
        required: true
        type: string
      location:
        required: false
        type: string
        default: westeurope
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_ENT_APP_APPLICATION_ID:
        required: true
      ENTRA_ADMINPRINCIPAL_ID:
        required: true        

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group if not exists
        run: |
          az group create \
            --name ${{ inputs.resource-group }} \
            --location ${{ inputs.location }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ACR
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file infra/acr.bicep \
            --parameters @infra/parameters-acr.json \
            --parameters environment=${{ inputs.environment }}

      - name: Resolve ACR login server
        id: acr
        run: |
          ACR_LOGIN_SERVER=$(az deployment group show \
            --resource-group ${{ inputs.resource-group }} \
            --name acr \
            --query properties.outputs.acrLoginServer.value \
            --output tsv)
          echo "login-server=${ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Deploy infrastructure from ACR modules
        run: |
          ACR_LOGIN_SERVER="${{ steps.acr.outputs.login-server }}"
          sed -i "s|acrcdkdev.azurecr.io|${ACR_LOGIN_SERVER}|g" bicepconfig.json
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file infra/main.bicep \
            --parameters @infra/parameters-main.json \
            --parameters environment=${{ inputs.environment }} administratorPrincipalId=${{ secrets.ENTRA_ADMINPRINCIPAL_ID }} pipelinePrincipalId=${{ secrets.AZURE_ENT_APP_APPLICATION_ID }}
