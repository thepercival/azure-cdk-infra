name: Reusable — deploy Bicep to environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource-group:
        required: true
        type: string
      location:
        required: false
        type: string
        default: westeurope
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ENTRA_ADMINPRINCIPAL_ID:
        required: true        

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group if not exists
        run: |
          az group create \
            --name ${{ inputs.resource-group }} \
            --location ${{ inputs.location }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ACR
        run: |
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file infra/acr.bicep \
            --parameters @infra/parameters-acr.json \
            --parameters environment=${{ inputs.environment }}

      - name: Publish Bicep modules to ACR
        run: |
          ACR_LOGIN_SERVER=$(az deployment group show \
            --resource-group ${{ inputs.resource-group }} \
            --name acr \
            --query properties.outputs.acrLoginServer.value \
            --output tsv)
          # version: 0.0.<run_number> — increments on every CI run
          VERSION="0.0.${{ github.run_number }}"
          az acr login --name "${ACR_LOGIN_SERVER%%.*}"
          for bicep_file in infra/acr-modules/*.bicep; do
            module_name="$(basename "$bicep_file" .bicep)"
            az bicep publish \
              --file "$bicep_file" \
              --target "br:${ACR_LOGIN_SERVER}/bicep/modules/${module_name}:${VERSION}" \
              --force
            az bicep publish \
              --file "$bicep_file" \
              --target "br:${ACR_LOGIN_SERVER}/bicep/modules/${module_name}:latest" \
              --force
            echo "Published ${module_name}:${VERSION} → ${ACR_LOGIN_SERVER}"
          done

      - name: Deploy infrastructure from ACR modules
        run: |
          ACR_LOGIN_SERVER=$(az deployment group show \
            --resource-group ${{ inputs.resource-group }} \
            --name acr \
            --query properties.outputs.acrLoginServer.value \
            --output tsv)
          # Point the br/modules alias at the environment-specific registry
          sed -i "s|acrcdkdev.azurecr.io|${ACR_LOGIN_SERVER}|g" bicepconfig.json
          az deployment group create \
            --resource-group ${{ inputs.resource-group }} \
            --template-file infra/main.bicep \
            --parameters @infra/parameters-main.json \
            --parameters environment=${{ inputs.environment }} administratorPrincipalId=${{ secrets.ENTRA_ADMINPRINCIPAL_ID }}
